[project]
name = "catalyst"
version = "0.1.0"
description = "Catalyst-driven convexity options trading system"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pandas-market-calendars>=4.4",
    "pyarrow>=16.0",
    "python-dateutil>=2.9",
    "yfinance>=1.5.2",
    "lxml>=6.1.1",
    "statsmodels>=0.14.6",
    "py-vollib-vectorized>=0.1.1",
    "nautilus-trader>=1.231.0",
    "lean>=1.0.228",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalyst", "src/edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"
