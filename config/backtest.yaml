# Backtest environment overlay — merged on top of base.yaml.
#
# v14 short-VRP campaign: the strategy spec EXPLICITLY mandates the full
# safeguard set (floor 40%, heat 25%, breakers, strict correlation) — a
# market-wide vol event hits every short-vol position at once, so the
# correlation cap is load-bearing here, not ceremonial. This supersedes the
# earlier unconstrained research profile for this campaign.
environment: backtest

execution:
  commissions:
    active_profile: "schwab"     # $0.65/contract/side — 4-leg condors pay 8x

risk:
  cash_floor_fraction: 0.40
  max_deployed: 0.25
  sizing_cost_buffer: 0.05
  daily_loss_halt: -0.08
  weekly_loss_halt: -0.15
  max_correlated_positions: 3
  correlation_threshold: 0.7
