# Edge platform configuration. All numeric parameters live here — code
# contains no hardcoded numbers. Loaded by edge.core.config.load_config().

data:
  # First day of the lockbox window: no research, fit, or tuning may ever
  # touch market data on or after this date until the lockbox is opened.
  lockbox_start: "2026-02-22"

validation:
  min_oos_trades: 300
  pbo_max: 0.5
  bootstrap_resamples: 10000

execution:
  spread_fill_fraction: 0.6
  slippage_pct: 0.02
  commission_per_contract: 0.65
  latency_ms: [100, 500, 2000]

risk:
  kelly_fraction: 0.25
  per_trade_cap_pct: 2.0
  daily_loss_halt_pct: 3.0
  target_daily_vol_pct: null
