  scan:                                  # State 1 — catalyst identification (pre-market)
    premarket_start: "04:00"             # ET
    premarket_end: "09:30"
    min_abs_gap: 0.08                    # |G| >= 8% vs prior regular-session close
    min_premarket_volume: 1000000        # V_pm >= 1,000,000 shares (consolidated/SIP)
  signal:                                # State 2 — volatility bypass + momentum vector
    session_open: "09:30"                # P_open sampled here; no trading before signal_time
    signal_time: "09:35"                 # evaluate first 5-min candle at exactly 09:35:00
  execution:                             # State 3 — contract selection + sizing
    max_dte: 3                           # nearest expiration with 0 <= DTE <= max_dte
    nav_fraction: 0.10                   # REQUESTED size (RiskManager remains authoritative)
    slippage_per_contract: 0.02          # flat $/contract, entry and exit
    synthetic_haircut: 0.10              # ONLY if NBBO missing; every such trade is flagged
    min_premium: 0.05                    # skip contracts quoted below this (spread dominates)
  exits:                                 # State 4 — first trigger wins
    ema_period: 9
    candle_minutes: 5
    hard_stop_loss: -0.50                # option value <= 50% of entry value
    time_stop: "15:50"                   # never hold overnight

drift:                                   # Drift Harvest — post-earnings defined-risk credit spreads
  enabled: true
  universe: *liquid_universe             # same 130 liquid optionable names
  entry_window_trading_days: [2, 5]      # enter this many sessions AFTER the reaction day
  min_abs_gap: 0.04                      # |realized overnight gap| — the measured "surprise"
  min_iv_richness: 1.10                  # ATM IV / trailing realized vol; only sell when paid well
  realized_vol_window: 20                # trading days for realized vol
  expiry_days: [14, 35]                  # 2-4 week expiry (theta works FOR us here)
  credit:                                # Arm A — directional credit spread (the new strategy)
    short_delta: 0.28                    # short leg, on the FAR side of the drift
    wing_width_pct: 0.05                 # long wing this far beyond short strike (% of spot)
    min_credit_fraction: 0.15            # skip if credit < this fraction of width (not paid enough)
    max_credit_fraction: 0.60            # skip if credit >= this (mispriced/illiquid quote)
  condor:                                # Arm B — direction-neutral control (isolates VRP)
    short_delta: 0.28
    wing_width_pct: 0.05
  debit:                                 # Arm C — drift-direction debit spread (isolates PEAD)
    long_delta: 0.40
    short_delta: 0.20
  per_trade_risk: 0.02                   # equity fraction at risk (RiskManager authoritative)
  exits:
    tp_credit_fraction: 0.55             # close after capturing this share of max credit
    stop_credit_multiple: 2.0            # close if liability reaches this multiple of credit
    tp_debit_fraction_of_max: 0.60       # debit arm: take profit at this fraction of width
    hold_trading_days: 10                # drift window
    close_before_expiry_days: 2

tournament:                              # winner-take-all competition objective
  enabled: true
  universe:                              # high-volatility optionable names — volatility is
    - "RIOT"                             # the raw material for a threshold objective
    - "MARA"
    - "SMCI"
    - "IONQ"
    - "RGTI"
    - "PLTR"
    - "COIN"
    - "HOOD"
    - "SOUN"
    - "TSLA"
