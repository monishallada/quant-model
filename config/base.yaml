    - "AFRM"
    - "UPST"
    - "CVNA"
    - "AMD"
    - "ENPH"
    - "RIVN"
    - "LCID"
    - "MSTR"
    - "APP"
  window_months: 7                       # competition length (6-8 month window)
  target_multiple: 10.0                  # what "winning" plausibly requires
  n_positions: 3                         # concentration
  hold_days: 21
  dte_days: 35
  moneyness: 1.10                        # OTM strike as fraction of spot
  capital_fraction: 0.90
  spread_pct: 0.06
  cost_per_contract: 0.02

index_vrp:                               # v8 — volatility risk premium harvest
  enabled: true
  # Universe is chosen by MEASURED round-trip cost, not by intuition. The
  # dividing line is ~5% of premium: above it, the spread eats any plausible
  # edge before the trade starts. Cheap-looking contracts are the trap — QUBT
  # costs $54 but 82.6% round trip; SPY costs $447 but 1.6%.
  symbols: ["SPY", "QQQ"]                # measured 1.6% / 1.9% round-trip cost
  entry_every_days: 7                    # systematic calendar entry, not event-driven
  dte_window: [25, 45]                   # target tenor at entry
  short_delta: 0.25                      # short leg (the premium being sold)
  wing_width_pct: 0.03                   # long wing this far beyond, as % of spot
  per_trade_risk: 0.05                   # equity fraction at risk (RiskManager authoritative)
  tp_credit_fraction: 0.50               # close after capturing this share of the credit
  stop_credit_multiple: 2.5              # close if the liability reaches N x credit
  close_before_expiry_days: 2
  min_credit_fraction: 0.08              # skip if credit < this share of width
  iv_rank_min: 0.0                       # optional regime gate (0 = always on)
  max_concurrent: 4                      # overlapping positions allowed

persymbol:                               # v9 — per-symbol strategy lab
  enabled: true
  universe: ["TSLA", "AMD", "NVDA", "AMZN", "META", "MSFT"]   # cleared the 5% cost screen
  entry_every_days: 21                   # monthly cycle
  dte_window: [25, 45]
  covered_call_delta: 0.30               # OTM call sold against a long share position
  put_spread_delta: 0.25                 # short leg of the put credit spread
  wing_width_pct: 0.05
  tp_credit_fraction: 0.50
  stop_credit_multiple: 2.5
  close_before_expiry_days: 2

# ---------------------------------------------------------------------------
# RISK — authoritative. These limits are enforced by RiskManager on every
# order and are never relaxed by any module, optimizer, or sweep result.
# ---------------------------------------------------------------------------
risk:
  cash_floor_fraction: 0.05              # NEVER deployed; hard survival guarantee
  sizing_cost_buffer: 0.05               # size as if fills cost this much beyond worst NBBO
  hedge_fraction: 0.10                   # index-put hedge sleeve (drawdown reducer)
  hedge:
    symbol: "SPY"                        # hedge instrument (index puts)
    put_delta: 0.25
    dte_window_days: [45, 100]           # buy puts with expiry in this window
    min_add_fraction: 0.25               # only add when budget gap >= this fraction of target
    check_weekday: 0                     # evaluate hedge Mondays (0=Mon) + when sleeve is empty
  max_deployed: 0.95                     # portfolio heat: total premium at risk cap
  max_correlated_positions: 3            # per correlation group
  correlation_lookback_days: 60
  correlation_threshold: 0.70            # underlyings above this are one group
  daily_loss_halt: -0.08                 # circuit breaker: halt new entries for the day
  weekly_loss_halt: -0.15                # circuit breaker: halt new entries for the week
  stop_loss_pct: -0.50                   # soft stop, % of premium (per-engine use_stops)
  close_before_expiry_days: 1            # avoid assignment/pin risk
  time_stop_after_catalyst_days: 1       # mandatory close after catalyst resolves (A/B/C)

execution:
  fill_model:                            # backtest fill assumptions (conservative)
    spread_fill_fraction: 0.60           # pay 60% toward ask on buys / toward bid on sells
    slippage_pct_of_premium: 0.02
  commissions:
    alpaca_per_contract: 0.00
    schwab_per_contract_per_leg: 0.65
    active_profile: "alpaca"             # which commission profile the backtest charges
  limit_price_offset: "mid"              # live limit orders: "mid" or ticks toward fill side
  limit_ticks_toward_fill: 1
  max_order_retries: 3
  retry_reprice_ticks: 1                 # move limit this many ticks toward fill per retry
  order_poll_seconds: 5
  unfilled_cancel_seconds: 120

backtest:
  start_date: "2018-01-01"               # ~8 years of ThetaData history
  end_date: "2026-08-01"
  train_test_split: 0.70                 # chronological
  walk_forward:
    train_months: 24
    test_months: 6
    step_months: 6
  monte_carlo:
    n_paths: 2000
    ruin_threshold_fraction: 0.50        # "ruin" = equity below 50% of start
    resample_block_size: 20              # block bootstrap of trade sequence
  sweep:                                 # parameter grid/random search space
    mode: "grid"                         # grid | random
    random_samples: 200
    # Gate 3 focused grid: the decision-relevant axes given Gate 2 findings
    # (engine enablement, Engine C sizing, stops on/off per engine). Structure
    # params (deltas/DTE) for engines whose signal shows no edge are NOT swept
    # — optimizing structure on an edgeless signal is overfitting bait; they
    # return to the grid when a signal with demonstrated edge exists.
    parameters:
      engines.engine_a.enabled: [true, false]
      engines.engine_b.enabled: [true, false]
      engines.engine_c.per_trade_risk: [0.02, 0.03]
      engines.engine_c.use_stops: [true, false]
      engines.engine_c.hold_days: [5, 7, 10]

observability:
  log_dir: "logs"
  log_level: "INFO"
  heartbeat_seconds: 60
  stale_data_alert_seconds: 300
  kill_switch_file: "KILL_SWITCH"        # main loop halts new entries if this file exists
  kill_switch_flatten: false             # if true, also flatten open positions on kill

short_vrp:                               # v14 concentrated short-VRP (iron condors)
  iv_rank_min: 0.80                      # trade only the richest premium
  iv_rv_min: 1.3                         # implied / 30d realized
  implied_vs_hist_min: 1.1               # implied move vs avg |move| last 8 earnings
  short_delta: 0.16                      # ~1-sigma short strikes
  max_dte: 9                             # first expiry >= event+1, capped
  tp_credit_fraction: 0.50               # take the crush at half the credit
  stop_credit_multiple: 2.0              # tested on AND off
  use_stops: true                        # spec default; twin runs toggle via --set short_vrp.use_stops=false
  per_trade_risk_fraction: 0.02          # of equity, on structural max loss
  max_leg_spread_pct_of_mid: 0.08

mosaic:                                  # v16 unified intraday options algorithm
  symbol: "SPY"
  horizon_minutes: 60
  vol_premium_min: 0.04
  dislocation_z_min: 3.0
  asym_min: 0.25
  ev_min_frac_of_maxloss: 0.05
  ev_min_dollars: 0.02
  max_rel_spread: 0.12
  max_hold_minutes: 90
  stop_loss_pct: -0.45
  credit_stop_multiple: 1.8
  per_trade_risk_fraction: 0.01
  warmup_sessions: 60
  use_stops: true
